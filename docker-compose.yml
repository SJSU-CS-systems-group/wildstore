services:
  mongo:
    image: mongo:6.0
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  wildstore-meta:
    build:
      context: .
      target: meta
    ports:
      - "27777:27777"
    environment:
      - spring.data.mongodb.uri=mongodb://mongo:27017/wildfire
      - custom.fileServer=http://wildstore-fileserve:27778
      - custom.frontendUrl=http://localhost:27777
      - spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:-placeholder}
      - spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:-placeholder}
      - spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:-placeholder}
      - spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:-placeholder}
    depends_on:
      - mongo

  wildstore-fileserve:
    build:
      context: .
      target: fileserve
    ports:
      - "27778:27778"
    environment:
      - custom.metadataServer=http://wildstore-meta:27777
    depends_on:
      - wildstore-meta

volumes:
  mongo-data:
